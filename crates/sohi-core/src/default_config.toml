# Sohi configuration.
#
# Delete a line to go back to its default. A file that fails to parse is
# ignored (Sohi logs a warning and uses the defaults).
# API keys are NOT stored here. Set them with:  sohi.exe --set-key mistral

[wake]
# Toggle voice / open text mode.
hotkey_voice = "Ctrl+Shift+Space"
hotkey_text = "Ctrl+Alt+T"
# Park the pointer in the top-right corner of the primary display to wake.
corner_size_px = 8      # hot zone size, physical pixels
dwell_ms = 350          # how long the pointer must stay there
cooldown_ms = 1500      # no corner wake this soon after Sohi hides
# After a voice reply, listen again until 8 s of silence (Esc stops).
follow_up = true

[ui]
launch_peek = true          # show briefly after start
reduced_motion = "system"   # "system" | "on" | "off"

[llm]
provider = "mistral"
model = "mistral-small-latest"
fallback_provider = "anthropic"
anthropic_model = ""        # e.g. "claude-haiku-5-5"; empty disables the Anthropic fallback.
                            # Its key: sohi.exe --set-key anthropic
offline_model = ""          # an Ollama model name; empty disables Ollama

[stt]
provider = "mistral"
model = "voxtral-mini-transcribe-3"
language = "auto"

[tts]
provider = "mistral"
voice = ""                       # empty uses the provider's default voice
offline_voice = "system-default" # a Windows OneCore voice name

[persona]
user_name = "Ashish"   # what Sohi calls you; empty for no name

[text]
speak_replies = false   # speak replies to typed prompts

[tools]
confirm = ["clipboard_get"]   # always ask before running these
disabled = []                 # never offer these to the model

[history]
persist = false   # keep conversation history across restarts

[log]
level = "info"    # "error" | "warn" | "info" | "debug" | "trace"
