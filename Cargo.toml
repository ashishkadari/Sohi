[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

# Every external crate is declared once here with default-features = false
# and an explicit feature list (spec §9.4). Member crates reference them with
# `{ workspace = true }`. Internal crates are added here when first used.
[workspace.dependencies]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"
