[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

# Every external crate is declared once here with default-features = false
# and an explicit feature list (spec §9.4). Member crates reference them with
# `{ workspace = true }`. Internal crates are added here when first used.
[workspace.dependencies]
sohi-audio = { path = "crates/sohi-audio" }
sohi-core = { path = "crates/sohi-core" }
sohi-providers = { path = "crates/sohi-providers" }
sohi-render = { path = "crates/sohi-render" }
sohi-win = { path = "crates/sohi-win" }

earshot = { version = "1.2.2", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
toml = { version = "1.2.2", default-features = false, features = ["std", "parse", "serde"] }
rtrb = { version = "0.4.1", default-features = false, features = ["std"] }
log = { version = "0.4.35", default-features = false, features = ["std"] }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "sync", "macros", "io-util"] }
windows = { version = "0.62.2", default-features = false, features = [
    "std",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"

# Spec §2.4. Binary size is tracked per phase with `cargo xtask bloat`.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
